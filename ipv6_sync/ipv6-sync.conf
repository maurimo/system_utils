# /etc/ipv6-sync/ipv6-sync.conf  -- read by ipv6-sync.service
# Secrets are NOT here: /etc/ipv6-sync/duckdns_token and /etc/ipv6-sync/router_password (root 0600)

# Interface to take the address from (empty = the one with the IPv6 default route)
IFACE=
# DuckDNS subdomain (without .duckdns.org); gets AAAA = stable address, A record cleared
DUCKDNS_DOMAIN=asm0d3us
# Linksys router (JNAP API, the same one the web UI uses)
ROUTER_URL=http://192.168.1.1
ROUTER_USER=admin
# IPv6 firewall rule (Security -> Firewall -> IPv6 port services) matched by its description;
# created with ROUTER_RULE_PORTS if missing. Ports: PROTO:PORT[-PORT][,PROTO:PORT...], max 2 ranges
ROUTER_RULE_DESCRIPTION=ssh
ROUTER_RULE_PORTS=TCP:22
# Seconds between full checks (address changes are also detected immediately)
CHECK_INTERVAL=600
