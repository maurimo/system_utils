# /etc/reverse-tunnel/tunnel.conf  -- read by reverse-tunnel.service
# Remote host B (publicly reachable) and the account the tunnel logs in as
REMOTE_HOST=mau81.duckdns.org
REMOTE_SSH_PORT=22
REMOTE_USER=tunnel
# Port opened on B; 0.0.0.0 = reachable from anywhere (needs
# "GatewayPorts clientspecified" or "yes" for this user in B's sshd_config)
REMOTE_BIND=0.0.0.0
REMOTE_PORT=3456
# Where connections arriving at B:REMOTE_PORT are delivered, as seen from this host
LOCAL_HOST=localhost
LOCAL_PORT=22
